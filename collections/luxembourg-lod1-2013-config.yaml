id: luxembourg-lod1-2013
title: Luxembourg 3D Building Models 2013 (LoD1)
description: |
  Nationwide LoD1 building models for the Grand Duchy of Luxembourg: simple
  blocks without roof detail, derived from the national topographic database
  (BD-TOPO-L) based on 2013 aerial imagery.

  Block height is the mean height of the vertices of the outer roof perimeter,
  taken from the photogrammetric survey carried out for the 2013 BD-TOPO-L update.

  Resolution is limited by that source: units are building blocks, so finer
  units such as individual terraced houses or distinctive partial sections
  (e.g. a church tower) are not separable.

  Coordinate reference system: LUREF / EPSG:2169.
license: CC0-1.0
keywords:
- 3d city model
- buildings
- LOD1
- Luxembourg
- CityGML
- BD-TOPO-L
providers:
- name: Administration du Cadastre et de la Topographie (ACT)
  url: https://act.public.lu/
  roles:
