  - licensor
  - host
  description: Luxembourg Cadastre and Topography Administration, the official government body responsible for cadastral and geospatial data
# The portal offers the same buildings at three aggregations: per commune, per
# canton, and one file for the whole country. Only the country-wide archive is
# listed here - adding the others would count every building three times.
