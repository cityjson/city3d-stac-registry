id: bordeaux-3d
title: Bordeaux Métropole 3D City Model
description: |
  3D LoD2 city model of Bordeaux Metropole, France.
  Photorealistic 3D model of the Bordeaux metropolitan area from summer 2012.
  Buildings are modelled at LOD2 (CityGML standard) with textures from aerial photography.
  The model is divided into downloadable tiles of 1.4 km x 1 km, subdivided into 200m x 200m sub-tiles.
  An untextured ("maquette blanche") version is also available as dataset bati3d_nt.

  Data format: AutoDesk 3DS (.3ds) - tile-based download through the Bordeaux Metropole open data portal.
  No CityJSON or CityGML files are directly available.
license: other
keywords:
- 3d city model
- buildings
- LOD2
- France
- Bordeaux
- 3DS
- textures
- photorealistic
- metropole
providers:
- name: Bordeaux Metropole
  url: https://www.bordeaux-metropole.fr/
  roles:
  - producer
  - licensor
  description: Bordeaux metropolitan area - original data producer
- name: Bordeaux Metropole Open Data
  url: https://opendata.bordeaux-metropole.fr/
  roles:
  - host
  description: Bordeaux Metropole open data portal (Opendatasoft platform)
inputs: [] # NOTE: Data is in 3DS format (not CityGML/CityJSON). Download via interactive portal only.
  # - https://data.bordeaux-metropole.fr/opendata/graphic_downloader/?layer=343&format=76 # Interactive area-based graphic downloader endpoint
extent:
  spatial:
    bbox: [-0.8838898, 44.7416956, -0.4549856, 45.0410389]
    crs: EPSG:4326  # bbox is longitude/latitude; native CRS is CC Zone 5 (EPSG:3945)
  temporal:
    start: '2012-01-01T00:00:00Z'
    end: '2012-12-31T23:59:59Z'
# Declared summaries (dataset not directly indexable; 3DS tile-based download
# only). LoD2/textures confirmed by this collection's own description
# ("Buildings are modelled at LOD2 (CityGML standard) with textures").
summaries:
  city3d:lods:
  - 2
  city3d:co_types:
  - Building
  city3d:textures:
  - true
