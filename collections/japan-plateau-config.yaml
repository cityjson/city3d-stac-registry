id: japan-plateau-3d
title: Japan PLATEAU 3D City Models
description: "National 3D city model project covering 260 municipalities across Japan with varying LoDs and feature types.\nPart of the PLATEAU project by the Japanese government (MLIT).\n170,413 CityGML files discovered via PLATEAU Data Catalog API.\n"
license: CC-BY-4.0
keywords:
- 3d city model
- buildings
- multi-LOD
- Japan
- national
- CityGML
- PLATEAU
- digital twin
- multi-city
providers:
- name: Ministry of Land, Infrastructure, Transport and Tourism (MLIT)
  url: https://www.mlit.go.jp/
  roles:
  - producer
  - licensor
  description: Japanese government ministry responsible for national 3D city model development and open data release
- name: G-Spatial Information Center
  url: https://front.geospatial.jp/plateau_portal_site/
  roles:
  - host
  description: Official data portal for PLATEAU 3D city model distribution
- name: PLATEAU Data Catalog API
  url: https://api.plateauview.mlit.go.jp/
  roles:
  - processor
  description: Official PLATEAU API for 3D city model data access and discovery
inputs:
  from_file: ../manifests/japan-plateau-urls.txt
# Throttle parallel downloads against the PLATEAU CMS — it is rate-sensitive
# and large zips have been seen to drop mid-transfer at higher concurrency.
concurrency: 2
extent:
  spatial:
    bbox: [122.93, 24.04, 153.99, 45.55] # [west, south, east, north] Japan national extent including outer islands
    crs: EPSG:4326 # bbox in WGS84; native CRS varies by JGD2011 plane-rectangular zone (EPSG:6669–6687)
  temporal:
    start: '2021-01-01T00:00:00Z'
    end: '2021-12-31T23:59:59Z'
links:
- rel: about
  href: https://api.plateauview.mlit.go.jp/docs/
  type: text/html
  title: PLATEAU Data Catalog API Documentation
- rel: source
  href: https://www.mlit.go.jp/plateau/
  type: text/html
  title: PLATEAU Official Website
- rel: source
  href: https://front.geospatial.jp/plateau_portal_site/
  type: text/html
  title: PLATEAU Data Portal (G-Spatial Information Center)
- rel: license
  href: https://creativecommons.org/licenses/by/4.0/
  type: text/html
  title: Creative Commons Attribution 4.0 International (CC BY 4.0)
