id: brussels-3d
title: Brussels 3D City Model (LoD2)
description: |
  3D LoD2 city model of Brussels, Belgium, from the UrbIS database.
  The UrbIS (Urban Information System) is the official geospatial database
  for the Brussels-Capital Region. Available in CityGML format.
  Data can be downloaded from the Brussels Datastore portal.
