id: luxembourg-bati3d-2020
title: Luxembourg National 3D Building Database 2020 (BD-L-Bati3D)
description: |
  Nationwide textured LoD2.2 building models for the Grand Duchy of Luxembourg,
  derived from summer 2020 aerial imagery (flight height ~3500 m, RMSE in x, y and
  z <= 20 cm) by photogrammetric roof restitution, downward extrusion, and
  texturing from oblique imagery.

  Only roofs of buildings with a footprint larger than 20 m2 were captured.
  Roof superstructures (e.g. dormers) are included where the longest side exceeds
  50 cm and the volume exceeds 1 m3.

  Distributed as one zip archive per commune, each containing a CityGML file with
  building, roof, wall and ground surface objects plus the JPEG textures. Every
  object carries a unique identifier linking it to its parent building.

  Coverage note: 99 communes are published here. The territory of the Ville de
  Luxembourg is not part of this edition - the data owner directs requests to the
  city's own topography and geomatics service. The 2023 edition
  (luxembourg-bati3d-2023) supersedes this one and does cover the capital.

  Coordinate reference system: LUREF LTM / EPSG:2169.
license: CC0-1.0
keywords:
