id: potsdam-3d
title: Potsdam 3D City Model (LoD2)
description: |
  3D LoD2 city model of Potsdam, Germany.
  Available in CityGML format. The data is also available as GeoJSON export
  via the Potsdam Open Data portal (Opendatasoft platform).
  Original data produced from laser scanning (2011) for the 2012 dataset.
license: DL-DE-BY-2.0
keywords:
- 3d city model
- buildings
- LOD2
- Germany
- Potsdam
- CityGML
- GeoJSON
providers:
- name: Landeshauptstadt Potsdam
  url: https://www.potsdam.de/
  roles:
  - producer
  - licensor
  description: Potsdam municipality - Official city government
inputs: []
extent:
  spatial:
    bbox: [12.89, 52.34, 13.17, 52.51]
    crs: EPSG:4326
  temporal:
    start: '2011-01-01T00:00:00Z'
    end: '2012-12-31T23:59:59Z'
# Declared summaries (dataset not directly indexable). LoD2/CityGML confirmed
# directly by this collection's own description.
summaries:
  city3d:lods:
  - 2
  city3d:co_types:
  - Building
