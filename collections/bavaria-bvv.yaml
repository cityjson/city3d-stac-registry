id: bvv-bavaria
title: Bavaria 3D Building Models
description: |
  Complete 3D building models (LoD2) for the state of Bavaria, Germany.
  Models feature ALKIS-compliant standard roof shapes and descriptive attributes.
  Geometries are derived from ALKIS building footprints, airborne laser scanning,
  and aerial digital surface models.
license: CC-BY-4.0
keywords:
  - 3d city model
  - germany
  - bavaria
  - buildings
  - citygml
  - lod2
providers:
  - name: Bayerische Vermessungsverwaltung (BVV)
    url: https://geodaten.bayern.de
    roles:
      - producer
      - licensor
    description: Bavarian State Administration for Surveying
    # NOTE: Contact information not available
inputs: [] # NOTE: Bulk download available via Metalink (.meta4) - not a directly processable format.
extent:
  spatial:
    bbox: [8.98, 47.27, 13.84, 50.56] # [west, south, east, north] Bavaria state boundaries
    crs: EPSG:4326
# Declared summaries (dataset not directly indexable; scoped to this LoD2
# product specifically, per the BVV product page linked below)
summaries:
  city3d:lods:
  - 2
  city3d:co_types:
  - Building
