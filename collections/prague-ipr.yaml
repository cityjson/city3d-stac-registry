id: ipr-prague-2020
title: Prague 3D Building Models
description: |
  Photogrammetrically processed 3D building model for Prague, Czech Republic.
  The dataset is divided into 1:5000 map sheets and is available in multiple
  formats including CityGML, 3D Shapefile, and Multipatch.
license: CC-BY-4.0
keywords:
  - 3d city model
  - czech republic
  - prague
  - buildings
  - citygml
providers:
  - name: Institut plánování a rozvoje hl. m. Prahy (IPR Prague)
    url: https://geoportalpraha.cz
    roles:
      - producer
      - licensor
      - host
    description: Prague Institute of Planning and Development
extent:
  spatial:
    bbox: [14.201491, 49.918791, 14.735087, 50.193123] # [west, south, east, north]
    crs: EPSG:4326 # bbox provided in WGS84; native CRS is EPSG:5514 (S-JTSK / Krovak East North)
  temporal:
    start: "2015-03-31T00:00:00Z" # NOTE: Extracted from data creation date described on website (1st link in 'Links')
    end: "2020-07-17T00:00:00Z" # NOTE: Extracted from data update date described on website (1st link in 'Links')
inputs: [] # NOTE: Area-based download via geoportal. See links for the portal.
# Declared summaries (dataset not directly indexable). Bridge confirmed by the
# "3D Buildings and Bridges Model" link title above; LoD2/TINRelief sourced
# from https://github.com/OloOcki/awesome-citygml (same geoportalpraha.cz portal).
summaries:
  city3d:lods:
  - 2
  city3d:co_types:
  - Building
  - Bridge
  - TINRelief
links:
  - rel: about
    href: https://geoportalpraha.cz/en/data-and-services/articles-and-projects/3D-model/3d-model-budovy-mosty
    type: text/html
    title: IPR Prague Geoportal - 3D Buildings and Bridges Model
  - rel: source
    href: https://geoportalpraha.cz
    type: text/html
    title: IPR Prague Geoportal - Home
  - rel: related
    href: https://geoportalpraha.cz/en/data-and-services/7e6316e95cfe4f36ae06bbfb687bf34b
    type: text/html
    title: IPR Prague Geoportal - 3D Model Dataset Page (LoD2, bridges, DEM)
  - rel: viewer
    href: https://app.iprpraha.cz/apl/app/model3d/
    type: text/html
    title: 3D Model Viewer - Prague
  - rel: license
    href: https://creativecommons.org/licenses/by/4.0/
    type: text/html
    title: Creative Commons Attribution 4.0 International (attribution "data base © IPR Praha")
# Additional Notes:
# - Formats available: CityGML, Multipatch, Shapefile, DGN, DWG
# - Structure: Divided by map sheets (1:5000)
# - Access: Area-based download. Data requires manual download of specific map sheets via the portal interface.
