id: hamburg-3d
title: Hamburg 3D City Model
description: "3D city model of Hamburg, Germany, available at both LoD1 and LoD2.\nCreated from cadastre footprints combined with LiDAR data.\nCovers the entire city area (~750 km²) with approximately 500,000 buildings.\nAvailable in CityGML format from the Hamburg Transparency Portal.\n"
license: DL-DE-BY-2.0
keywords:
- 3d city model
- buildings
- LOD1
- LOD2
- Germany
- Hamburg
- CityGML
- LiDAR
- multi-LOD
providers:
- name: Free and Hanseatic City of Hamburg
  url: https://www.hamburg.de/
  roles:
  - producer
  - licensor
  description: Hamburg city government
- name: Hamburg Transparency Portal
  url: https://suche.transparenz.hamburg.de/
  roles:
  - host
  description: Official open data portal of Hamburg
inputs: [] # NOTE: Single 468MB GML file; commenting out to generate metadata-only collection for now.
  # - http://archiv.transparenz.hamburg.de/hmbtgarchive/HMDK/lod2-de_hh_2016-11-22_21283_snap_1.GML
extent:
  spatial:
    bbox: [9.7277, 53.3950, 10.3253, 53.7412] # Hamburg approximate extent
    crs: EPSG:4326
  temporal:
    start: '2017-01-01T00:00:00Z'
    end: '2017-12-31T23:59:59Z'
# Declared summaries (dataset not directly indexable; sourced from
# https://github.com/OloOcki/awesome-citygml, cross-checked against the same
# suche.transparenz.hamburg.de dataset page linked below)
summaries:
  city3d:lods:
  - 1
  - 2
  city3d:co_types:
  - Building
  city3d:textures:
  - true
