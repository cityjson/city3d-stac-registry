id: north-rhine-westphalia-3d
title: North Rhine-Westphalia 3D Building Models (LoD1+LoD2)
description: "Enormous 3D building dataset covering the entire state of North Rhine-Westphalia (NRW), Germany.\nNRW is the most populated state in Germany. Cities included: Düsseldorf, Essen, Oberhausen,\nKöln (Cologne), Bonn, and many more.\nCreated from cadastre footprints, LiDAR, and aerial images.\nLoD1 is derived from LoD2 models with average roof height.\nAvailable in CityGML format.\nDeprecated duplicate configuration; use `nordrhein-westfalen-geobasis-config.yaml` / `geobasis-nrw` for the canonical entry.\n"
license: DL-DE-ZERO-2.0
