id: rotterdam-3d
title: Rotterdam 3D City Model
description: "3D LoD2 city model of Rotterdam, Netherlands, with textures.\nCreated from cadastre footprints combined with LiDAR data.\nThis sample dataset covers the Delfshaven district of Rotterdam.\nOriginal data available in CityGML format from the city open data portal.\n"
license: other # Rotterdam 3D open data is published as "Publiek domein" (Creative Commons Public Domain Mark 1.0) per data.overheid.nl (dataset 10230-rotterdam-3d).
keywords:
- 3d city model
- buildings
- LOD2
- Netherlands
- Rotterdam
- CityGML
- textured
- LiDAR
- port city
- Delfshaven
providers:
- name: Municipality of Rotterdam
  url: https://www.rotterdam.nl/
  roles:
  - producer
  - licensor
  description: City of Rotterdam - Official municipality government
- name: Kadaster
  url: https://www.kadaster.nl/
  roles:
  - processor
  description: Netherlands Cadastre, Land Registry and Mapping Agency - provided BAG building footprints and AHN elevation data
- name: TU Delft 3D Geoinformation
  url: https://3d.bk.tudelft.nl/
  roles:
  - processor
  - host
  description: 3D Geoinformation Research Group at TU Delft - converted to CityJSON and hosts sample dataset
inputs:
  - https://3d.bk.tudelft.nl/opendata/cityjson/3dcities/v2.0/3-20-DELFSHAVEN.city.json
  - https://3d.bk.tudelft.nl/opendata/cityjson/3dcities/citygml/3-20-DELFSHAVEN.xml
  - https://3d.bk.tudelft.nl/opendata/cityjson/3dcities/citygml/3-20-DELFSHAVEN.zip  # Textures
